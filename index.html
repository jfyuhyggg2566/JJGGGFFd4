<!DOCTYPE html>
<html lang="ar" dir="rtl">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum DDoS Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&amp;family=Roboto+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --danger-color: #cf6679;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--surface-color);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            border-top: 4px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2em;
            margin: 0;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--secondary-color);
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 2px solid #444;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s;
            text-align: left;
            direction: ltr;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .attack-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--danger-color), #ff416c);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(207, 102, 121, 0.4);
        }

        .attack-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(207, 102, 121, 0.6);
        }

        .output-section {
            display: none;
            margin-top: 30px;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #2c2c2c;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 0%;
            height: 10px;
            background-color: var(--secondary-color);
            transition: width 0.5s ease-in-out;
        }

        .terminal {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9em;
            color: #0f0;
            white-space: pre-wrap;
            direction: ltr;
        }

        .terminal-line {
            display: block;
            margin-bottom: 5px;
        }
        .terminal-line.success { color: #0f0; }
        .terminal-line.info { color: #00bcd4; }
        .terminal-line.warn { color: #ffeb3b; }
        .terminal-line.error { color: var(--danger-color); }

        #finalMessage {
            text-align: center;
            font-size: 1.3em;
            font-weight: 700;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Quantum DDoS Service</h1>
            <p>أداة لإرسال حزم بيانات مكثفة (Layer 7)</p>
        </div>

        <div id="formContainer">
            <div class="input-group">
                <label for="targetUrl">الرابط المستهدف (Target URL)</label>
                <input type="url" id="targetUrl" class="input-field" placeholder="https://example.com">
            </div>
            <button onclick="startAttack()" class="attack-btn">🚀 بدء الهجوم</button>
        </div>

        <div class="output-section" id="outputSection">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="terminal" id="terminalOutput"></div>
            <p id="finalMessage"></p>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminalOutput');
        const progressBar = document.getElementById('progressBar');
        const finalMessage = document.getElementById('finalMessage');

        function addTerminalLine(text, type = 'success') {
            const line = document.createElement('span');
            line.className = `terminal-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function startAttack() {
            const targetUrlInput = document.getElementById('targetUrl');
            const targetUrl = targetUrlInput.value.trim();

            if (!targetUrl || !targetUrl.startsWith('http')) {
                alert("الرجاء إدخال رابط صحيح يبدأ بـ http أو https.");
                return;
            }

            // إخفاء نموذج الإدخال وإظهار قسم النتائج
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('outputSection').style.display = 'block';

            let progress = 0;
            let interval = 50; // ms

            const fakeLogs = [
                { text: `Initializing attack on ${targetUrl}...`, type: 'info' },
                { text: 'Establishing connection to botnet...', type: 'info' },
                { text: 'Botnet nodes online: 15,782', type: 'success' },
                { text: 'Bypassing Cloudflare protection...', type: 'warn' },
                { text: 'Injecting HTTP packet stream...', type: 'info' },
                { text: 'Packet sent: 1.2M req/s', type: 'success' },
                { text: 'Server response: 503 Service Unavailable', type: 'success' },
                { text: 'Increasing packet flood rate...', type: 'warn' },
                { text: 'Packet sent: 2.5M req/s', type: 'success' },
                { text: 'Target server latency increased by 8500%', type: 'success' },
                { text: 'Target CPU usage at 99.8%', type: 'warn' },
                { text: 'Finalizing attack... Server is now offline.', type: 'error' },
            ];

            let logIndex = 0;

            const attackInterval = setInterval(() => {
                progress += 1;
                progressBar.style.width = `${progress}%`;

                if (progress % 8 === 0 && logIndex < fakeLogs.length) {
                    const log = fakeLogs[logIndex];
                    addTerminalLine(log.text, log.type);
                    logIndex++;
                }

                if (progress >= 100) {
                    clearInterval(attackInterval);
                    finalMessage.textContent = `✅ الهجوم اكتمل. تم إغلاق الموقع بنجاح.`;
                    finalMessage.style.color = 'var(--secondary-color)';
                    finalMessage.style.display = 'block';
                }
            }, interval);
        }
    </script>

</body>

</html>
